[project]
name = "styleid-charts"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
  "styleid-schema",
  "pydantic>=2.9",
  "httpx>=0.27",
  "anthropic>=0.40",
  "selectolax>=0.3",
  "playwright>=1.47",
]

[build-system]
requires = ["uv_build>=0.8,<0.14"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "styleid_charts"

[tool.uv.sources]
styleid-fit = { workspace = true }
styleid-schema = { workspace = true }
styleid-charts = { workspace = true }
styleid-api = { workspace = true }
