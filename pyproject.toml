[project]
name = "style-id"
version = "0.1.0"
description = "style.id — measurement-based fit for tops (monorepo root)"
requires-python = ">=3.12"
dependencies = []

[tool.uv]
package = false

[tool.uv.workspace]
members = ["packages/*", "services/*"]

[dependency-groups]
dev = [
  "pytest>=8.3",
  "pytest-cov>=5",
  "hypothesis>=6.100",
  "ruff>=0.6",
  "mypy>=1.11",
]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["packages/*/src", "services/*/src"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "RUF"]
ignore = ["RUF012"]

[tool.mypy]
python_version = "3.12"
strict = true
mypy_path = "packages/fitengine/src:packages/schema/src:packages/chartextract/src:packages/bodyfit/src:services/api/src"
plugins = ["pydantic.mypy"]

[tool.pytest.ini_options]
testpaths = ["packages", "services"]
addopts = "-q"
