services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: styleid
      POSTGRES_PASSWORD: styleid
      POSTGRES_DB: styleid
    ports: ["5432:5432"]
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U styleid"]
      interval: 5s
      retries: 10

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: styleid
      MINIO_ROOT_PASSWORD: styleid-dev
    ports: ["9000:9000", "9001:9001"]
    volumes: [miniodata:/data]

  api:
    build: { context: .., dockerfile: infra/Dockerfile.api }
    depends_on: { db: { condition: service_healthy } }
    environment:
      DATABASE_URL: postgresql+psycopg://styleid:styleid@db:5432/styleid
      STYLEID_EXTRACTION_RUNNER: queue
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      BLOB_ENDPOINT: http://minio:9000
    ports: ["8000:8000"]
    command: >
      sh -c "uv run alembic -c services/api/alembic.ini upgrade head &&
             uv run uvicorn styleid_api.main:app --host 0.0.0.0 --port 8000"

  worker:
    build: { context: .., dockerfile: infra/Dockerfile.api }
    depends_on: { db: { condition: service_healthy } }
    environment:
      DATABASE_URL: postgresql+psycopg://styleid:styleid@db:5432/styleid
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
    command: uv run python -m styleid_worker

volumes:
  pgdata:
  miniodata:
