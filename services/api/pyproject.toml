[project]
name = "styleid-api"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
  "styleid-schema",
  "styleid-fit",
  "styleid-charts",
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "sqlalchemy>=2.0",
  "alembic>=1.13",
  "psycopg[binary]>=3.2",
  "procrastinate[psycopg]>=2.14",
  "pydantic-settings>=2.5",
  "python-jose[cryptography]>=3.3",
  "httpx>=0.27",
]

[build-system]
requires = ["uv_build>=0.8,<0.14"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "styleid_api"

[tool.uv.sources]
styleid-fit = { workspace = true }
styleid-schema = { workspace = true }
styleid-charts = { workspace = true }
styleid-api = { workspace = true }

[dependency-groups]
dev = [
  "types-python-jose>=3.3",
]
