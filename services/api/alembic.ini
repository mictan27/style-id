# Run from anywhere: uv run alembic -c services/api/alembic.ini upgrade head
# The database URL comes from STYLEID_DATABASE_URL / DATABASE_URL (see styleid_api.config),
# or from `-x url=...`, or from `sqlalchemy.url` set programmatically.
[alembic]
script_location = %(here)s/src/styleid_api/db/alembic
file_template = %%(rev)s_%%(slug)s
prepend_sys_path = .
path_separator = os

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
